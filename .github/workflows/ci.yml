name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test

      - name: Reproducible symbolic music evaluation
        env:
          MIDI_SPARK_EVAL_OUTPUT: music-evaluation
        run: npm run eval:music

      - name: Verify paired evaluation comparison CLI
        run: npm run eval:compare -- music-evaluation.json music-evaluation.json > /dev/null

      - name: Build
        run: npm run build

      - name: Publish diagnostic benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbolic-music-evaluation
          path: |
            music-evaluation.md
            music-evaluation.json
          retention-days: 30
          if-no-files-found: warn
