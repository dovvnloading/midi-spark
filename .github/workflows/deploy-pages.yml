name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build for project Pages base path
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          npm run build -- --base "/${REPO_NAME}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify the public URL serves the compiled app
        shell: bash
        run: |
          set -euo pipefail
          site="https://dovvnloading.github.io/midi-spark/"
          for attempt in 1 2 3; do
            html="$(curl --silent --show-error --fail --location --max-time 15 "$site" || true)"
            bundle="$(printf '%s' "$html" | grep -oE 'src="/midi-spark/assets/index-[^"]+[.]js"' | head -n1 | cut -d '"' -f2 || true)"
            if [[ -n "$bundle" ]] && curl --silent --fail --location --head --max-time 15 "https://dovvnloading.github.io$bundle" >/dev/null; then
              echo "Public Pages URL serves the compiled Vite app."
              exit 0
            fi
            sleep 8
          done
          echo "::error::Pages is not serving the compiled Vite app. Set Settings → Pages → Source to GitHub Actions, not Deploy from a branch."
          exit 1
