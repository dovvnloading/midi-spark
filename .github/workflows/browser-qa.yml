name: Browser UX checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the browser run it left going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Decides whether the browser tests need to run for this change. A job
    # skipped by its `if` reports success, so required checks never hang.
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SKIP_IF: '^(docs/.*|.*\.md|LICENSE|\.github/workflows/(ci|deploy-pages)\.yml)$'
        run: |
          browser=true
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch -q --depth=1 origin "$BEFORE"; then changed=$(git diff --name-only "$BEFORE" HEAD); fi
          fi
          if [ -n "$changed" ]; then
            if [ -n "${RUN_IF:-}" ]; then
              echo "$changed" | grep -qE "$RUN_IF" || browser=false
            else
              echo "$changed" | grep -qvE "$SKIP_IF" || browser=false
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  chromium:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright (system Chrome)
        run: |
          python -m pip install playwright==1.57.0
          command -v google-chrome || command -v chromium
      - name: Validate browser regression script
        run: python -m py_compile scripts/browser_smoke.py scripts/browser_accessibility.py scripts/library_qa.py
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Browser interaction and responsive acceptance
        run: CHROMIUM_PATH=/usr/bin/google-chrome python scripts/browser_smoke.py --url http://127.0.0.1:4173 --output browser-report
      - name: Computed accessibility and simulated touch acceptance
        run: CHROMIUM_PATH=/usr/bin/google-chrome python scripts/browser_accessibility.py --url http://127.0.0.1:4173 --output browser-report
      - name: Sound Library premium UX and robustness acceptance
        run: CHROMIUM_PATH=/usr/bin/google-chrome python scripts/library_qa.py --url http://127.0.0.1:4173 --output browser-report
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: browser-report/
          retention-days: 7
          if-no-files-found: warn
