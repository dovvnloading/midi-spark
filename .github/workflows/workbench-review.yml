name: Workbench review

on:
  push:
    branches: [ux/canvas-first-workbench]

# Temporary branch-only transfer of the locally rendered and tested source.
# The payload, this workflow, and write permission remove themselves on success.
permissions:
  contents: write

concurrency:
  group: workbench-transfer
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-verified reviewed source
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path
          parts = [Path(f'.github/workbench-update.{i}') for i in range(4)]
          packed = b''.join(part.read_bytes() for part in parts)
          assert hashlib.sha256(packed).hexdigest() == '956e77c35e3ee49017ceb94e0f442768104a41b81039a1d23095982ca6330058'
          changes = json.loads(lzma.decompress(packed))
          for change in changes:
              path = Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              if 'content' in change:
                  result = change['content']
                  assert not path.exists() or path.read_text() == result, f'Unexpected existing file: {path}'
              else:
                  original = path.read_text()
                  assert hashlib.sha256(original.encode()).hexdigest() == change['base'], f'Base changed: {path}'
                  lines = original.splitlines(keepends=True)
                  for hunk in reversed(change['hunks']):
                      begin = hunk['start']
                      lines[begin:begin + hunk['count']] = hunk['text'].splitlines(keepends=True)
                  result = ''.join(lines)
              assert hashlib.sha256(result.encode()).hexdigest() == change['sha'], f'Final checksum mismatch: {path}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(result)
              print('Verified', path)
          for part in parts:
              part.unlink()
          Path('.github/workflows/workbench-review.yml').unlink()
          PY
      - name: Tighten real-browser acceptance selectors and runner setup
        run: |
          python - <<'PY'
          from pathlib import Path
          suite = Path('scripts/browser_smoke.py')
          source = suite.read_text()
          before = "page.get_by_role('button',name='Generate pattern',exact=True).click()"
          after = "page.get_by_role('button',name='Generate pattern',exact=False).click()"
          assert before in source
          source = source.replace(before, after)
          quota_before = """page.evaluate("Storage.prototype.setItem = () => { throw new DOMException('Quota', 'QuotaExceededError'); }")"""
          quota_after = """page.evaluate("() => { Storage.prototype.setItem = () => { throw new DOMException('Quota', 'QuotaExceededError'); }; }")"""
          assert quota_before in source
          suite.write_text(source.replace(quota_before, quota_after))

          workflow = Path('.github/workflows/browser-qa.yml')
          yml = workflow.read_text()
          before = '      - run: python -m playwright install --with-deps chromium'
          after = '      - run: command -v google-chrome || command -v chromium'
          assert before in yml
          yml = yml.replace(before, after)
          before = 'run: python scripts/browser_smoke.py --url http://127.0.0.1:4173 --output browser-report'
          after = 'run: CHROMIUM_PATH=/usr/bin/google-chrome python scripts/browser_smoke.py --url http://127.0.0.1:4173 --output browser-report'
          assert before in yml
          workflow.write_text(yml.replace(before, after))
          PY
      - run: npm ci
      - name: Static checks and unit tests
        run: npm run typecheck && npm run lint -- --max-warnings 0 && npm test
      - run: npm run build
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          command -v google-chrome || command -v chromium || { echo "System Chrome unavailable"; exit 1; }
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Browser interaction and responsive acceptance
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          python scripts/browser_smoke.py --url http://127.0.0.1:4173 --output browser-report
      - name: Retain screenshots and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: browser-report/
          retention-days: 7
          if-no-files-found: warn
      - name: Commit only the verified implementation to this branch
        if: success()
        run: |
          test "$GITHUB_REF" = "refs/heads/ux/canvas-first-workbench"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: canvas-first studio with verified pointer and responsive UX"
          git push origin HEAD:refs/heads/ux/canvas-first-workbench
